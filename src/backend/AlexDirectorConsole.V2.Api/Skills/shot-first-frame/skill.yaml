schemaVersion: 1
kind: skill
id: shot-first-frame
name: 镜头首帧
description: 根据当前分镜和当前视觉资产组织首帧生成任务。
version: 1.1.0
allowedTools:
  - generate_missing_storyboard_image_prompts
  - generate_next_storyboard_first_frame
instructions: |-
  为每个可生产镜头生成连续性一致的首帧任务。
  只使用当前或明确指定的视觉资产版本并记录依赖；缺失关键参考时阻断生成并报告。
  先调用 generate_missing_storyboard_image_prompts 补齐提示词。
  每次调用 generate_next_storyboard_first_frame 只生成下一张；remaining 大于 0 时继续自动推进，直到全部完成、失败、被停止或达到运行上限。绝不调用视频生成工具。
