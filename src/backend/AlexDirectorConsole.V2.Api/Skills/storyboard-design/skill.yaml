schemaVersion: 1
kind: skill
id: storyboard-design
name: 分镜设计
description: 将当前正式剧本转换为结构化、可校验、可生产的镜头设计。
version: 2.3.0
allowedTools:
  - generate_storyboard
instructions: |-
  根据剧本、视觉资产和时长约束生成结构化镜头。
  每个镜头必须归属一个生产集和剧本场次；不改写剧本对白与事件顺序；每镜最多承载一个说话人的一句对白。输出中 dialogueCharacter 只保存角色名，dialogue 只保存实际发音台词，不得拼成“角色：台词”。按“发音字符数 ÷ 2.5 + 1.0 秒”校验每条对白；角色缺失、台词改写或镜头过短都会被确定性拒绝，此时必须返回上游修正正式剧本或 shotPlan，不能压缩发音。默认只生产首帧，只有必须锁定连续性终点状态时才使用首尾帧。
  只有 generate_storyboard 返回 generated 后才能报告完成。
